<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#dcefe4"><title>こもれび水槽</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:#31594b;background:#dcefe4}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;z-index:2;background:rgba(250,255,245,.84);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(57,100,78,.09);backdrop-filter:blur(12px);border-radius:23px}
header{top:15px;left:15px;padding:13px 18px;max-width:calc(100% - 30px)}h1{font-size:19px;margin:0 0 3px;letter-spacing:.06em}header p{font-size:11px;color:#769084;margin:0}
#hint{position:fixed;right:15px;top:92px;z-index:2;padding:8px 12px;border-radius:16px;background:#f7fff0bd;color:#789084;font-size:10px}
#info{left:15px;bottom:15px;width:min(290px,calc(100% - 30px));padding:13px 16px}#name{font-size:17px;font-weight:800}#mood{font-size:12px;color:#6c897b;margin-top:3px}#tip{font-size:10px;color:#8aa094;margin-top:8px;line-height:1.5}
.controls{position:fixed;right:15px;bottom:15px;z-index:3;display:flex;flex-direction:column;gap:8px}button{border:1px solid #fff;background:rgba(250,255,245,.9);color:#426b59;border-radius:17px;padding:11px 14px;font:600 12px system-ui;box-shadow:0 5px 18px #31594b14;backdrop-filter:blur(10px)}button:active{transform:scale(.97)}
@media(max-width:520px){header{top:10px;left:10px}#hint{top:83px;right:10px}#info{left:10px;bottom:10px;width:calc(100% - 20px);max-width:260px}.controls{right:10px;bottom:10px}button{padding:10px 11px;font-size:11px}}
</style></head><body>
<canvas id="pond"></canvas>
<header class="panel"><h1>こもれび水槽</h1><p>小さな水辺で、のんびり暮らすカメを眺めよう。</p></header>
<div id="hint">画面をなぞって、水槽を見渡そう</div>
<section id="info" class="panel"><div id="name">みどり</div><div id="mood">水草のそばで、ぷかぷか。</div><div id="tip">カメをタップすると、こちらに気づくよ。</div></section>
<div class="controls"><button id="camera">⟳　視点をリセット</button><button id="pause">Ⅱ　ひと休み</button><button id="light">☼　昼 / 夕方</button></div>
<script>
(()=> {
const canvas=document.getElementById('pond'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,paused=false,evening=false,angle=0,zoom=1,look=0,touchX=null,lastPinch=0;
const mood=document.getElementById('mood');
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rr(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function ellipse(x,y,rx,ry,fill,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}
function plant(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);for(let i=0;i<5;i++){const a=-1.1+i*.48+Math.sin(t*.6+i)*.07;ctx.save();ctx.rotate(a);line([[0,0],[0,-65]],'#548e70',3);ellipse(0,-37,9,24,'#78b58b',-.18);ellipse(0,-55,7,18,'#9bc99b',.12);ctx.restore()}ctx.restore()}
function drawTurtle(t){
 const cx=W*.51+Math.sin(t*.28)*W*.045+angle*35,cy=H*.53+Math.sin(t*1.3)*7;
 const scale=Math.min(W/390,H/700)*zoom*1.08;
 ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
 // soft shadow
 ellipse(0,68,112,18,'rgba(49,91,72,.12)');
 // rear flippers
 ellipse(-62,36,36,17,'#83b88c',-.55+Math.sin(t*2)*.12);ellipse(58,36,36,17,'#83b88c',.55-Math.sin(t*2)*.12);
 // body
 ellipse(0,18,77,43,'#a4c99a');
 // front flippers
 ellipse(-62,-3,38,19,'#8fbe91',-.5+Math.sin(t*2.1)*.1);ellipse(61,-2,38,19,'#8fbe91',.5-Math.sin(t*2.1)*.1);
 // shell shadow and shell
 ellipse(-3,-8,83,60,'#547d5b');ellipse(-3,-13,79,57,'#789c68');
 // shell center panels
 ellipse(-3,-18,58,42,'#8eaf78');
 line([[-3,-67],[-3,-48],[-3,-15],[-3,25]],'#648b5e',2);
 line([[-69,-25],[-43,-27],[-3,-18],[38,-27],[65,-22]],'#648b5e',2);
 // shell subtle highlights
 ellipse(-28,-39,23,8,'rgba(225,239,190,.28)',-.25);
 // neck/head
 line([[58,-13],[82,-24],[97,-22]],'#8fbd8c',23);
 ellipse(104,-27,31,25,'#9bc995');
 // cheeks and eyes
 ellipse(119,-16,7,5,'#e9a6a0');ellipse(112,-37,4,5,'#365b49');ellipse(113,-39,1.5,1.8,'#fff');
 // smile
 ctx.strokeStyle='#547b5c';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(121,-24,7,.2,1.35);ctx.stroke();
 // tiny nostril
 ellipse(130,-30,1.6,1.4,'#547b5c');
 // gentle shell speckles
 for(let i=0;i<7;i++){const a=i*Math.PI*2/7;ellipse(-3+Math.cos(a)*47,-15+Math.sin(a)*32,3,2,'rgba(224,237,190,.55)')}
 ctx.restore();
}
function draw(t){
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,evening?'#9bb5b0':'#d9eee2');bg.addColorStop(.55,evening?'#789e9a':'#b9dfd1');bg.addColorStop(1,evening?'#668d86':'#a5cfb9');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // distant soft sun glow
 const glow=ctx.createRadialGradient(W*.76,H*.22,4,W*.76,H*.22,H*.48);glow.addColorStop(0,evening?'rgba(255,205,145,.28)':'rgba(255,248,205,.52)');glow.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 // aquarium floor
 ctx.fillStyle=evening?'#b0a887':'#d5cda9';ctx.beginPath();ctx.moveTo(0,H*.76);ctx.quadraticCurveTo(W*.5,H*.69,W,H*.76);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // soft stones
 for(let i=0;i<28;i++){const x=(i*97%Math.max(W,1)),y=H*.83+(i%4)*H*.035;ellipse(x,y,8+(i%5)*3,4+(i%3)*2,i%2?'#c2b994':'#b1b18d')}
 // plants
 plant(W*.12,H*.81,.8,t);plant(W*.85,H*.79,.95,t+1);plant(W*.25,H*.84,.48,t+2);
 // driftwood
 line([[W*.65,H*.82],[W*.59,H*.73],[W*.56,H*.69]],'#927e5e',12);
 // floating plants and bubbles
 for(let i=0;i<7;i++){const x=(i*139+Math.sin(t*.3+i)*13)%W,y=H*.35+Math.sin(t*.7+i)*H*.17;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,3+(i%3)*2,0,Math.PI*2);ctx.stroke()}
 // water shimmer
 for(let i=0;i<9;i++){const x=(i*113+t*8)%W,y=H*.23+(i%4)*H*.13;ctx.strokeStyle=evening?'rgba(238,231,194,.12)':'rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,22+(i%3)*8,4,0,0,Math.PI*2);ctx.stroke()}
 drawTurtle(t);
 // gentle vignette
 const v=ctx.createRadialGradient(W/2,H/2,H*.18,W/2,H/2,H*.8);v.addColorStop(0,'rgba(255,255,255,0)');v.addColorStop(1,'rgba(39,81,64,.10)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
let start=performance.now();function frame(now){requestAnimationFrame(frame);const t=(now-start)/1000;if(!paused)draw(t);else if(!canvas.dataset.still){draw(t);canvas.dataset.still='1'}else return;if(!paused)delete canvas.dataset.still}
requestAnimationFrame(frame);
canvas.addEventListener('pointerdown',e=>{touchX=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(touchX!==null){angle=Math.max(-1.3,Math.min(1.3,angle+(e.clientX-touchX)/W));touchX=e.clientX}});
canvas.addEventListener('pointerup',e=>{if(touchX!==null&&Math.abs(e.clientX-touchX)<8){look=1;mood.textContent='みどりが、こちらに気づいたみたい。'}touchX=null});
document.getElementById('camera').onclick=()=>{angle=0;zoom=1};
document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶　うごきだす':'Ⅱ　ひと休み';mood.textContent=paused?'水の中で、のんびり休憩中。':'水草のそばで、ぷかぷか。';if(!paused)delete canvas.dataset.still};
document.getElementById('light').onclick=()=>{evening=!evening;mood.textContent=evening?'夕暮れの水辺で、ゆったり。':'水草のそばで、ぷかぷか。'};
})();
</script></body></html>
