<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrifanTheck</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Water.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.9);
            background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 80%, rgba(0,0,0,0) 100%);
            padding: 20px 40px;
            border-radius: 20px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 300px;
            backdrop-filter: blur(4px);
            transition: opacity 1.5s ease-in-out, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #ui-container.collapsed {
            transform: translate(-50%, calc(100% - 36px));
        }

        #ui-toggle-btn {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 40, 55, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
            transition: background 0.3s, transform 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #ui-toggle-btn:hover {
            background: rgba(50, 70, 95, 0.9);
        }
        #ui-container.collapsed #ui-toggle-btn {
            transform: translateX(-50%) rotate(180deg);
        }

        .ui-main-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 40px;
            transition: opacity 0.3s;
        }
        
        #ui-container.collapsed .ui-main-row,
        #ui-container.collapsed #instruction {
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            #ui-container {
                bottom: 15px;
                padding: 15px 20px 12px;
                min-width: 260px;
                width: 85%;
                max-width: 340px;
            }
            .ui-main-row {
                gap: 18px;
            }
            #circular-slider {
                width: 80px;
                height: 80px;
            }
            #slider-thumb {
                width: 18px;
                height: 18px;
            }
            .time-label {
                font-size: 0.65rem;
            }
            .time-label.top { top: -16px; }
            .time-label.bottom { bottom: -16px; }
            .time-label.left { left: -18px; }
            .time-label.right { right: -18px; }
            h1 {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }
            #time-display {
                font-size: 1.05rem;
            }
            #write-btn {
                top: 15px;
                right: 15px;
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            #notebook-btn {
                top: 60px !important;
                right: 15px !important;
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            #notebook-container {
                padding: 20px 20px !important;
                width: 90% !important;
            }
        }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 2px;
        }
        .bottle-count-num {
            text-combine-upright: all;
            display: inline-block;
        }
        h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 4px;
            pointer-events: none;
        }
        
        #circular-slider {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            position: relative;
            margin: 10px auto;
            touch-action: none; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.2);
        }
        #slider-thumb {
            width: 22px;
            height: 22px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 12px rgba(255,255,255,0.9), 0 2px 4px rgba(0,0,0,0.5);
        }
        #time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }
        .time-label {
            position: absolute;
            font-size: 0.7rem;
            opacity: 0.7;
            pointer-events: none;
            font-weight: bold;
        }
        .time-label.top { top: -20px; left: 50%; transform: translateX(-50%); }
        .time-label.bottom { bottom: -20px; left: 50%; transform: translateX(-50%); }
        .time-label.left { top: 50%; left: -25px; transform: translateY(-50%); }
        .time-label.right { top: 50%; right: -25px; transform: translateY(-50%); }
        
        #instruction {
            margin-top: 12px;
            font-size: 0.75rem;
            opacity: 0.6;
            pointer-events: none;
            transition: opacity 1s ease-out;
        }
        
        /* 共通の紙のようなテクスチャとスタイル */
        .paper-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fdfbf5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.07'/%3E%3C/svg%3E");
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 50px rgba(160, 140, 110, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.08);
            display: none;
            flex-direction: column;
            z-index: 100;
            pointer-events: auto;
        }

        #message-container {
            padding: 45px 40px;
            align-items: center;
            min-width: 320px;
            max-width: 80%;
        }
        
        #message-text {
            font-family: 'Klee One', cursive; 
            font-size: 1.45rem;
            line-height: 2.3;
            text-align: center;
            margin-bottom: 35px;
            white-space: pre-wrap;
            letter-spacing: 0.1em;
            color: #2c2825; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.03);
        }
        
        #close-msg-btn, #close-notebook-btn {
            background: #62727b; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            align-self: center;
        }
        #close-msg-btn:hover, #close-notebook-btn:hover {
            background: #4c5a61;
        }
        
        .btn {
            background: #4a6fa5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #37537d;
        }
        
        #write-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 50;
            pointer-events: auto;
            transition: all 0.4s ease;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 0 10px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            font-family: 'Klee One', cursive;
            letter-spacing: 2px;
            padding: 10px 22px;
            border-radius: 25px;
        }
        #write-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.1) 100%);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        
        #notebook-btn {
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 50;
            pointer-events: auto;
            transition: all 0.4s ease;
            background: linear-gradient(135deg, #4a2f1d 0%, #2e1b0f 100%);
            color: #d4af37;
            border: 1px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 8px rgba(212, 175, 55, 0.15);
            font-family: 'Klee One', cursive;
            letter-spacing: 2px;
            padding: 10px 22px;
            border-radius: 4px;
        }
        #notebook-btn:hover {
            background: linear-gradient(135deg, #5c3b24 0%, #3e2414 100%);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 0 15px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .hidden-ui {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        
        #compose-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #ffffff;
            padding: 35px 30px;
            border-radius: 20px 20px 45px 45px; /* ボトルの底のような丸み */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.2);
            display: none;
            flex-direction: column;
            align-items: center;
            width: 360px;
            z-index: 100;
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.7); /* ガラスのハイライト */
        }
        #compose-container h2 {
            margin-top: 0;
            font-size: 1.4rem;
            margin-bottom: 20px;
            font-family: 'Klee One', cursive;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        #compose-textarea {
            width: 100%;
            height: 130px;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.15);
            color: #fff;
            resize: none;
            font-family: 'Klee One', cursive;
            font-size: 1.1rem;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        #compose-textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        #compose-textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.25);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }
        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }
        /* コルク風の送信ボタン */
        #send-btn {
            background: linear-gradient(to bottom, #9c683f, #6e4424) !important;
            border: 1px solid #b88a62;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fdfbf5;
            font-family: 'Klee One', cursive;
            letter-spacing: 1px;
            padding: 10px 25px;
        }
        #send-btn:hover {
            background: linear-gradient(to bottom, #ad7649, #7d4d29) !important;
        }
        #cancel-btn {
            background: rgba(255,255,255,0.1) !important;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            font-family: 'Klee One', cursive;
            letter-spacing: 1px;
            padding: 10px 20px;
        }
        #cancel-btn:hover {
            background: rgba(255,255,255,0.2) !important;
        }

        /* 記憶のノートUI */
        #notebook-container {
            padding: 40px 50px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            color: #e0d8c8;
            background-color: #3a2318;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            border: 1px solid #5a3d24;
            border-radius: 6px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), inset 0 0 50px rgba(30, 15, 10, 0.8);
        }
        .notebook-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 15px;
            margin-bottom: 20px;
            position: relative;
        }
        .notebook-header::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(212, 175, 55, 0.3);
        }
        .notebook-header h2 {
            margin: 0;
            font-family: 'Montserrat', 'Klee One', sans-serif;
            font-size: 1.8rem;
            color: #d4af37;
            font-weight: 300;
            letter-spacing: 3px;
        }
        #close-notebook-btn {
            background: transparent;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.5);
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            padding: 6px 16px;
            box-shadow: none;
            align-self: center;
        }
        #close-notebook-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        
        .notebook-body {
            display: flex;
            flex-direction: row;
            gap: 25px;
            flex: 1;
            min-height: 0;
        }
        .notebook-sidebar {
            flex: 1;
            overflow-y: auto;
            font-family: 'Klee One', cursive;
            padding-right: 15px;
        }
        .notebook-sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .notebook-sidebar::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.6);
            border-radius: 2px;
        }
        .notebook-sidebar h3 {
            font-size: 1.15rem;
            margin-top: 25px;
            margin-bottom: 15px;
            color: #a89c8a;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
            padding-bottom: 5px;
            letter-spacing: 2px;
        }
        .notebook-sidebar ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .notebook-sidebar li {
            background: rgba(40, 20, 10, 0.4);
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 4px;
            border-left: 2px solid #5a7b8c;
            font-size: 1rem;
            line-height: 1.8;
            box-shadow: inset 0 0 10px rgba(20, 10, 5, 0.8);
            white-space: pre-wrap;
            color: #e0d8c8;
        }
        .item-li {
            border-left-color: #d4af37 !important;
            font-size: 0.95rem !important;
            cursor: pointer;
            transition: all 0.2s;
        }
        .item-li:hover {
            background: rgba(212, 175, 55, 0.1) !important;
            transform: translateX(4px);
        }

        #preview-area {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(circle at center, transparent 30%, rgba(139, 115, 85, 0.3) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"),
                #eaddc5;
            border-radius: 8px;
            border: 1px solid rgba(139, 115, 85, 0.5);
            position: relative;
            min-width: 250px;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(90, 60, 30, 0.3), inset 0 5px 15px rgba(0,0,0,0.15);
        }
        #preview-canvas {
            width: 100%;
            height: 100%;
            display: none;
            cursor: grab;
            touch-action: none;
        }
        #preview-canvas:active {
            cursor: grabbing;
        }
        #preview-text {
            position: absolute;
            bottom: 15px;
            font-size: 0.85rem;
            color: #5a4b3c;
            font-family: 'Klee One', cursive;
            letter-spacing: 1px;
            pointer-events: none;
            display: none;
            text-shadow: none;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
        }
        
        @media (max-width: 600px) {
            #notebook-container {
                height: 85vh;
                padding: 20px 25px !important;
                flex-direction: column;
                display: none;
            }
            .notebook-body {
                flex-direction: column;
            }
            #preview-area {
                flex: none;
                height: 250px;
                min-height: 250px;
                width: 100%;
            }
        }
        
        #dial-picker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 15, 25, 0.95);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            padding: 12px 6px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.05);
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }
        .dial-wheel-container {
            height: 130px;
            width: 42px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            position: relative;
            margin-bottom: 10px;
            cursor: ns-resize;
            mask-image: linear-gradient(to bottom, transparent, black 35%, black 65%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 35%, black 65%, transparent);
        }
        .dial-wheel-container::-webkit-scrollbar {
            display: none;
        }
        #dial-wheel {
            list-style: none;
            margin: 0;
            padding: 52px 0;
            text-align: center;
            pointer-events: auto;
        }
        #dial-wheel li {
            height: 26px;
            line-height: 26px;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.3);
            scroll-snap-align: center;
            transition: all 0.2s;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-variant-numeric: tabular-nums;
        }
        .dial-selector {
            position: absolute;
            top: 52px;
            left: 0;
            width: 100%;
            height: 26px;
            border-top: 1px solid rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.6);
            pointer-events: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
        }
        
        #time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .time-part {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s, transform 0.1s;
        }
        .time-part:hover {
            background: rgba(255,255,255,0.2);
        }
        .time-part:active {
            transform: scale(0.9);
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease-in-out;
        }
        .logo-wrapper {
            text-align: center;
            margin-bottom: 50px;
            transition: opacity 0.5s ease-in-out;
        }
        #start-btn {
            background: transparent;
            color: white;
            border: 2px solid rgba(255,255,255,0.6);
            padding: 12px 40px;
            font-size: 1.2rem;
            letter-spacing: 4px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Klee One', cursive;
        }
        #start-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <div class="logo-wrapper">
            <svg width="120" height="120" viewBox="0 0 100 100" style="margin-bottom: 20px;">
                <defs>
                    <clipPath id="circle-clip">
                        <circle cx="50" cy="50" r="48" />
                    </clipPath>
                </defs>

        const PRESET_MESSAGES = [

        function resetUITimer() {
            const uiContainer = document.getElementById('ui-container');
            const writeBtn = document.getElementById('write-btn');
            const notebookBtn = document.getElementById('notebook-btn');
            
            if (uiContainer) uiContainer.classList.remove('hidden-ui');
            if (writeBtn) writeBtn.classList.remove('hidden-ui');
            if (notebookBtn) notebookBtn.classList.remove('hidden-ui');
            
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => {
                const msgContainer = document.getElementById('message-container');
                const compContainer = document.getElementById('compose-container');
                const nbContainer = document.getElementById('notebook-container');
                
                if ((!msgContainer || msgContainer.style.display !== 'flex') &&
                    (!compContainer || compContainer.style.display !== 'flex') &&
                    (!nbContainer || nbContainer.style.display !== 'flex')) {
                    if (uiContainer) uiContainer.classList.add('hidden-ui');
                    if (writeBtn) writeBtn.classList.add('hidden-ui');
                    if (notebookBtn) notebookBtn.classList.add('hidden-ui');
                }
            }, UI_HIDE_DELAY);
        }

        async function initAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return; 
                
                if (!audioCtx) {
                    audioCtx = new AudioContext();
                    const bufferSize = audioCtx.sampleRate * 2; 
                    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    
                    let lastOut = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        output[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = output[i];
                        output[i] *= 3.5; 
                    }
                    
                    noiseNode = audioCtx.createBufferSource();
                    noiseNode.buffer = noiseBuffer;
                    noiseNode.loop = true;
                    
                    biquadFilter = audioCtx.createBiquadFilter();
                    biquadFilter.type = "lowpass";
                    biquadFilter.frequency.value = 400; 
                    
                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = 0; 
                    
                    noiseNode.connect(biquadFilter);
                    biquadFilter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    noiseNode.start();
                    
                    playWaveSound();
                    scheduleNextWave();
                }

                if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
                    await audioCtx.resume();
                }
                
                const instruction = document.getElementById('instruction');
                if (instruction && instruction.style.opacity !== '0') {
                    instruction.style.opacity = '0';
                    setTimeout(() => { instruction.style.display = 'none'; }, 1000);
                }
            } catch(e) {
                console.error("Audio init failed", e);
            }
        }

        function scheduleNextWave() {
            if(!audioCtx) return;
            const interval = 6600 + Math.random() * 1000; 
            setTimeout(() => {
                playWaveSound();
                scheduleNextWave();
            }, interval);
        }

        function playChimeSound() {
            if(!audioCtx) return;
            if(audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
                audioCtx.resume().catch(e => console.log("Audio resume prevented:", e));
            }
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000 + Math.random() * 500, now);
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 3.0); 
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 3.0);
        }

        function playWhaleSound() {
            if(!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, now); 
            osc.frequency.exponentialRampToValueAtTime(60, now + 5.0);
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.3, now + 2.0); 
            gain.gain.linearRampToValueAtTime(0.3, now + 4.0);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 7.0); 
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 7.0);
        }

        function playWatchSoundAndShowTime() {
            if(!audioCtx) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            showMessage("古い時計の針が、静かに時を刻んでいる。\n\n[ " + timeStr + " ]");

            let count = 0;
            const tick = () => {
                if(count >= 12 || audioCtx.state !== 'running') {
                    clearInterval(watchSoundInterval);
                    return;
                }
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(count % 2 === 0 ? 900 : 1200, t);
                
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1500, t);
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.05, t + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(t);
                osc.stop(t + 0.1);
                count++;
            };
            
            clearInterval(watchSoundInterval);
            tick();
            watchSoundInterval = setInterval(tick, 1000);
        }

        function playRecordSound() {
            if(!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            
            showMessage("古いレコード盤から、\n波の音に混じってノスタルジックなメロディが聴こえる…");

            const noiseOsc = audioCtx.createOscillator();
            noiseOsc.type = 'sawtooth';
            noiseOsc.frequency.setValueAtTime(50, now);
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(6000, now);
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.01, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 8.0);
            
            noiseOsc.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseOsc.start(now);
            noiseOsc.stop(now + 8.0);

            const notes = [329.63, 392.00, 440.00, 523.25, 659.25, 587.33, 440.00, 392.00]; 
            let startTime = now;
            
            for(let i = 0; i < notes.length; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[i], startTime);
                
                const lfo = audioCtx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.setValueAtTime(2.5, startTime);
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.setValueAtTime(6, startTime); 
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start(startTime);
                lfo.stop(startTime + 1.5);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, startTime);
                
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.08, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.5);
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(startTime);
                osc.stop(startTime + 1.5);
                
                startTime += 0.8 + Math.random() * 0.2; 
            }
        }

        function playGlassSound() {
            if(!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            
            showMessage("波に揺られて、\nガラスの浮き玉が「カラン…」と涼しげな音を立てた。");

            const freqs = [2200, 2600]; 
            let startTime = now;
            
            freqs.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq + (Math.random()*50), startTime + i*0.06);
                
                gain.gain.setValueAtTime(0, startTime + i*0.06);
                gain.gain.linearRampToValueAtTime(0.12, startTime + i*0.06 + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + i*0.06 + 0.6);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(startTime + i*0.06);
                osc.stop(startTime + i*0.06 + 0.6);
            });
        }

        async function playWaveSound() {
            if(!audioCtx) return;
            if(audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
                try {
                   await audioCtx.resume();
                } catch(e) {
                   console.log("Audio resume prevented:", e);
                }
            }
            const now = audioCtx.currentTime;
            
            gainNode.gain.cancelScheduledValues(now);
            biquadFilter.frequency.cancelScheduledValues(now);
            
            gainNode.gain.setValueAtTime(gainNode.gain.value, now);
            biquadFilter.frequency.setValueAtTime(biquadFilter.frequency.value, now);
            
            gainNode.gain.linearRampToValueAtTime(0.035 + Math.random() * 0.02, now + 1.5);
            biquadFilter.frequency.linearRampToValueAtTime(600 + Math.random() * 200, now + 1.5);
            
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 4.5);
            biquadFilter.frequency.exponentialRampToValueAtTime(200, now + 4.5);
            gainNode.gain.setValueAtTime(0, now + 4.6);
        }

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
            camera.position.set(0, 5, 16);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);

            document.body.appendChild(renderer.domElement);

            pmremGenerator = new THREE.PMREMGenerator(renderer);

            sun = new THREE.Vector3();

            const waterGeometry = new THREE.PlaneGeometry(40000, 40000);

                    waterNormals: new THREE.TextureLoader().load(
                        'https://threejs.org/examples/textures/waternormals.jpg',
                        function (texture) {
                            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
                        }
                    ),
                    sunDirection: new THREE.Vector3(),
                    sunColor: SUNSET_COLOR.getHex(),
                    waterColor: WATER_BASE_SUNSET.getHex(),
                    distortionScale: 1.5,
                    fog: true
                }
            );
            water.rotation.x = -Math.PI / 2;
            scene.add(water);

            scene.fog = new THREE.FogExp2(0x8899aa, 0.000);

            sky = new THREE.Sky();
            sky.scale.setScalar(10000);
            scene.add(sky);
            
            const skyUniforms = sky.material.uniforms;
            skyUniforms['turbidity'].value = 10;
            skyUniforms['rayleigh'].value = 3;
            skyUniforms['mieCoefficient'].value = 0.000; 
            skyUniforms['mieDirectionalG'].value = 0.8; 

            particleGeo = new THREE.SphereGeometry(0.4, 16, 16); 

            createSunAndMoon();
            createStars();
            createShootingStar(); 
            createParticleTexture();
            createBioluminescence();
            createWhale(); 
            createBirds();

            ambientLight = new THREE.AmbientLight(0x404040, 0.5); 
            scene.add(ambientLight);
            
            directionalLight = new THREE.DirectionalLight(SUNSET_COLOR.getHex(), 1); 
            scene.add(directionalLight);

            createRock();
            createFloaters(12, 100, 10, 4, 4, 6);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enablePan = false; 
            controls.minDistance = 2.0; 
            controls.maxDistance = 250.0; 
            controls.maxPolarAngle = 1.55; 
            
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('mousemove', resetUITimer);
            window.addEventListener('touchstart', resetUITimer);
            window.addEventListener('wheel', resetUITimer);
            
            setupUI();
            setSliderToProgress(17.5 / 24); 
        }
        
        function updateNotebookUI() {
            const msgUl = document.getElementById('notebook-messages');
            const itemsUl = document.getElementById('notebook-items');
            
            if (msgUl) {
                msgUl.innerHTML = '';
                if (readMessagesList.length === 0) {
                    msgUl.innerHTML = '<li>まだメッセージを拾っていません。</li>';
                } else {
                    for (let i = readMessagesList.length - 1; i >= 0; i--) {
                        const li = document.createElement('li');
                        li.innerText = readMessagesList[i];
                        msgUl.appendChild(li);
                    }
                }
            }
            
            if (itemsUl) {
                itemsUl.innerHTML = '';
                if (touchedItemsSet.size === 0) {
                    itemsUl.innerHTML = '<li class="item-li" style="cursor:default;">特別な漂流物にはまだ触れていません。</li>';
                    showPreviewModel(""); // プレビューをクリア
                } else {
                    touchedItemsSet.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'item-li';
                        li.innerText = item;
                        li.addEventListener('click', () => {
                            showPreviewModel(item);
                            // 選択状態のスタイリング
                            document.querySelectorAll('.item-li').forEach(el => el.style.background = '');
                            li.style.background = 'rgba(212, 175, 55, 0.2)';
                        });
                        itemsUl.appendChild(li);
                    });
                    
                    // リストの最初の一つを自動選択
                    const firstLi = itemsUl.querySelector('.item-li');
                    if (firstLi) firstLi.click();
                }
            }
        }

        // --- プレビュー用3D空間の初期化 ---
        function initPreview() {
            const canvas = document.getElementById('preview-canvas');
            if(!canvas) return;
            
            previewRenderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            previewScene = new THREE.Scene();
            previewCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            previewCamera.position.z = 6;

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            previewScene.add(ambient);
            
            // レコードの溝や時計の金属が綺麗に反射するようにライトを調整
            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
            dirLight.position.set(5, 10, 7); 
            previewScene.add(dirLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 1.2, 20); // 反射・ハイライト用
            pointLight.position.set(0, 5, 2);
            previewScene.add(pointLight);

            const fillLight = new THREE.DirectionalLight(0x88bbff, 0.8);
            fillLight.position.set(-5, 2, -5);
            previewScene.add(fillLight);

            // タッチ・マウス操作の手動実装（スワイプ回転）
            canvas.addEventListener('pointerdown', (e) => {
                previewIsDragging = true;
                previewPrevMouse.x = e.clientX;
                previewPrevMouse.y = e.clientY;
                e.stopPropagation();
            });
            window.addEventListener('pointermove', (e) => {
                if(!previewIsDragging || !previewModel) return;
                const dx = e.clientX - previewPrevMouse.x;
                const dy = e.clientY - previewPrevMouse.y;
                previewModel.rotation.y += dx * 0.015;
                previewModel.rotation.x += dy * 0.015;
                previewPrevMouse.x = e.clientX;
                previewPrevMouse.y = e.clientY;
            });
            window.addEventListener('pointerup', () => {
                previewIsDragging = false;
            });
            
            // ホイールでズーム
            canvas.addEventListener('wheel', (e) => {
                previewCamera.position.z += e.deltaY * 0.005;
                previewCamera.position.z = THREE.MathUtils.clamp(previewCamera.position.z, 2.5, 15);
                e.preventDefault();
            }, {passive: false});
            
            // スマホのピンチ操作（2本指ズーム）
            canvas.addEventListener('touchstart', (e) => {
                if(e.touches.length === 2) {
                    previewPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                }
            }, {passive: false});
            canvas.addEventListener('touchmove', (e) => {
                if(e.touches.length === 2) {
                    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    const diff = previewPinchDist - dist;
                    previewCamera.position.z += diff * 0.03;
                    previewCamera.position.z = THREE.MathUtils.clamp(previewCamera.position.z, 2.5, 15);
                    previewPinchDist = dist;
                    e.preventDefault();
                }
            }, {passive: false});
        }

        function resizePreview() {
            const container = document.getElementById('preview-area');
            if(!container || !previewRenderer) return;
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (w === 0 || h === 0) return;
            previewRenderer.setSize(w, h);
            previewCamera.aspect = w / h;
            previewCamera.updateProjectionMatrix();
        }

                    }

            renderP();

        function initDialPicker() {
            const hText = document.getElementById('hour-text');
            const mText = document.getElementById('minute-text');
            const dialPicker = document.getElementById('dial-picker');
            const dialContainer = document.querySelector('.dial-wheel-container');
            
            if (hText) {
                hText.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDial('hour');
                });
                hText.addEventListener('pointerdown', e => e.stopPropagation());
            }
            if (mText) {
                mText.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDial('minute');
                });
                mText.addEventListener('pointerdown', e => e.stopPropagation());
            }
            
            if (dialPicker) {
                dialPicker.addEventListener('click', (e) => {
                    if (e.target !== dialContainer && !e.target.closest('#dial-wheel')) {
                        confirmDial();
                    }
                });
            }
            
            if (dialContainer) {
                dialContainer.addEventListener('scroll', () => {
                    const centerIndex = Math.round(dialContainer.scrollTop / 26);
                    const lis = document.getElementById('dial-wheel').querySelectorAll('li');
                    lis.forEach((li, idx) => {
                        if (idx === centerIndex) {
                            li.style.color = '#fff';
                            li.style.fontSize = '1.3rem';
                            li.style.fontWeight = 'bold';
                        } else {
                            li.style.color = 'rgba(255,255,255,0.3)';
                            li.style.fontSize = '1.1rem';
                            li.style.fontWeight = 'normal';
                        }
                    });
                });
                
                dialContainer.addEventListener('click', (e) => {
                    if(e.target === dialContainer || e.target.classList.contains('dial-selector')) {
                        confirmDial();
                    }
                });
            }
        }
        
        function openDial(mode) {
            isHourMode = (mode === 'hour');
            const picker = document.getElementById('dial-picker');
            const wheel = document.getElementById('dial-wheel');
            
            wheel.innerHTML = '';
            const max = isHourMode ? 24 : 60; 
            
            for (let i = 0; i < max; i++) {
                const li = document.createElement('li');
                li.innerText = i.toString().padStart(2, '0');
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    confirmDial(i);
                });
                wheel.appendChild(li);
            }
            
            picker.style.display = 'flex';
            
            setTimeout(() => {
                const container = document.querySelector('.dial-wheel-container');
                const targetValue = isHourMode ? currentHours : currentMinutes;
                container.scrollTop = targetValue * 26;
                container.dispatchEvent(new Event('scroll'));
            }, 10);
        }
        
        function confirmDial(selectedValue) {
            const container = document.querySelector('.dial-wheel-container');
            let val = selectedValue !== undefined ? selectedValue : Math.round(container.scrollTop / 26);
            
            if (isHourMode) {
                currentHours = val;
            } else {
                currentMinutes = val;
            }
            
            let newProgress = (currentHours + currentMinutes / 60) / 24;
            setSliderToProgress(newProgress);
            
            document.getElementById('dial-picker').style.display = 'none';
        }
        
        let isDraggingSlider = false;

        function initCircularSlider() {
            const circularSlider = document.getElementById('circular-slider');
            if (!circularSlider) return;

            circularSlider.addEventListener('pointerdown', (e) => {
                isDraggingSlider = true;
                updateSliderFromEvent(e);
                e.stopPropagation();
                initAudio();
                resetUITimer();
            });
            
            window.addEventListener('pointermove', (e) => {
                if (!isDraggingSlider) return;
                updateSliderFromEvent(e);
                resetUITimer();
            });
            
            window.addEventListener('pointerup', () => {
                isDraggingSlider = false;
            });
        }

        function setSliderToProgress(progress) {
            const thetaClock = progress * Math.PI * 2 - Math.PI; 
            const angle = thetaClock - Math.PI / 2;
            updateSliderThumb(angle, progress);
            updateTimeOfDay(progress);
        }

        function updateSliderFromEvent(e) {
            const circularSlider = document.getElementById('circular-slider');
            if (!circularSlider) return;
            const rect = circularSlider.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            
            let angle = Math.atan2(e.clientY - cy, e.clientX - cx);
            
            let thetaClock = angle + Math.PI / 2; 
            if (thetaClock < 0) thetaClock += Math.PI * 2;
            
            let progress = (thetaClock + Math.PI) % (Math.PI * 2) / (Math.PI * 2);
            
            updateSliderThumb(angle, progress);
            updateTimeOfDay(progress);
        }

        function updateSliderThumb(angle, progress) {
            const sliderThumb = document.getElementById('slider-thumb');
            const timeDisplay = document.getElementById('time-display');
            if (!sliderThumb || !timeDisplay) return;
            
            const r = 50; 
            const thumbX = 50 + Math.cos(angle) * r;
            const thumbY = 50 + Math.sin(angle) * r;
            
            sliderThumb.style.left = thumbX + 'px';
            sliderThumb.style.top = thumbY + 'px';
            
            let hours = Math.floor(progress * 24);
            if (hours >= 24) hours = 0;
            let minutes = Math.floor((progress * 24 - hours) * 60);
            
            currentHours = hours;
            currentMinutes = minutes;
            
            const hText = document.getElementById('hour-text');
            const mText = document.getElementById('minute-text');
            if (hText) hText.innerText = hours.toString().padStart(2, '0');
            if (mText) mText.innerText = minutes.toString().padStart(2, '0');
        }

        function onPointerDown(event) {
            if (event.target !== renderer.domElement) return;

            initAudio(); 
            resetUITimer();
            
            if (document.getElementById('message-container').style.display === 'flex' || 
                document.getElementById('compose-container').style.display === 'flex' ||
                document.getElementById('notebook-container').style.display === 'flex') {
                return;
            }

            pointerDownPos.x = event.clientX;
            pointerDownPos.y = event.clientY;
        }

        function onPointerUp(event) {
            if (event.target !== renderer.domElement) return;

            if (document.getElementById('message-container').style.display === 'flex' || 
                document.getElementById('compose-container').style.display === 'flex' ||
                document.getElementById('notebook-container').style.display === 'flex') {
                return;
            }

            const dx = event.clientX - pointerDownPos.x;
            const dy = event.clientY - pointerDownPos.y;
            
            if (dx * dx + dy * dy > 400) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const activeFloaters = floaters.filter(f => !f.userData.isSinking);
            
            for (let i = 0; i < activeFloaters.length; i++) {
                const group = activeFloaters[i];
                const intersects = raycaster.intersectObjects(group.children, true);
                
                if (intersects.length > 0) {
                    if (group.userData.isBottle) {
                        showMessage(group.userData.message);
                        group.userData.isSinking = true; 
                        
                        spawnRipple(group.position); 

                        const cork = group.getObjectByName("cork");
                        const letter = group.getObjectByName("letter");
                        const string = group.getObjectByName("string");
                        if (cork) cork.visible = false;
                        if (letter) letter.visible = false;
                        if (string) string.visible = false;

                    } else if (group.userData.isLantern) {
                        playChimeSound();
                        group.userData.glowStartTime = performance.now();
                        group.userData.isGlowing = true;
                        spawnLanternParticles(group.position);
                        touchedItemsSet.add("海を漂う古いランタン");
                    } else if (group.userData.isWatch) {
                        playWatchSoundAndShowTime();
                        spawnRipple(group.position);
                        group.userData.rotSpeed += (Math.random() - 0.5) * 0.15;
                        touchedItemsSet.add("時を刻むアンティーク時計");
                    } else if (group.userData.isRecord) {
                        playRecordSound();
                        spawnRipple(group.position);
                        group.userData.rotSpeed += 0.2; 
                        touchedItemsSet.add("ノスタルジックな古いレコード盤");
                    } else if (group.userData.isGlassBall) {
                        playGlassSound();
                        spawnRipple(group.position);
                        group.userData.rotSpeed += (Math.random() - 0.5) * 0.3; 
                        touchedItemsSet.add("波間を漂うガラスの浮き玉");
                    } else {
                        group.userData.isPushed = true;
                        group.userData.pushStartTime = performance.now();
                        group.userData.rotSpeed += (Math.random() - 0.5) * 0.1; 
                        touchedItemsSet.add("波間を漂う古い流木");
                    }
                    break;
                }
            }
        }
        
        function showMessage(text) {
            const msgText = document.getElementById('message-text');
            if (msgText) msgText.innerText = text;
            
            const msgContainer = document.getElementById('message-container');
            if (msgContainer) msgContainer.style.display = 'flex';

                setTimeout(() => {
                    counterElement.style.textShadow = '0px 2px 4px rgba(0, 0, 0, 0.9)';
                }, 500);
            }
        }

        function createRock() {
            const geometry = new THREE.IcosahedronGeometry(3.5, 4);
            const pos = geometry.attributes.position;

            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);

                const len = Math.sqrt(x * x + y * y + z * z);
                const nx = x / len;
                const ny = y / len;
                const nz = z / len;

                const warp = Math.sin(nx * 3.2 + ny * 2.1 + nz * 1.8) * 2.0 
                           + Math.cos(nx * 1.8 - nz * 3.8) * 1.6;

                const sharpSpike = Math.pow(Math.abs(Math.sin(nx * 5.2 + ny * 3.5)), 2.5) * 1.85
                                 + Math.pow(Math.abs(Math.cos(nz * 6.0 + nx * 3.8)), 2.6) * 1.65;

                const crag = Math.sin(nx * 8.5 + ny * 6.5) * Math.cos(nz * 7.5 + ny * 4.0) * 0.4;
                const gouge = Math.sin(nx * 2.2 + 0.8) * Math.cos(nz * 2.8) * 2.0;

                const radiusScale = 0.72 + (warp * 0.28) + (sharpSpike * 0.28) + (crag * 0.15) + (gouge * 0.22);

                x = nx * len * radiusScale;
                y = ny * len * radiusScale;
                z = nz * len * radiusScale;

                if (y > 0) {
                    y *= 1.25;
                    y += Math.pow(Math.max(0, ny), 1.8) * 1.35 * (1.0 + Math.sin(nx * 4.5) * 0.5);
                } else {
                    y *= 0.85;
                }

                x += Math.sin(y * 0.45) * 1.3;
                z += Math.cos(y * 0.35) * 1.0;

                pos.setXYZ(i, x, y, z);
            }

            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({
                color: 0x546270, 
                roughness: 0.6,
                metalness: 0.2,
                emissive: 0x111b24,
                flatShading: true
            });

            rock = new THREE.Mesh(geometry, material);
            rock.position.set(0, 1.4, 0);
            scene.add(rock);
        }

        function createNewBottle(message) {
            const dir = new THREE.Vector3(0, 0, -1);
            dir.applyQuaternion(camera.quaternion);
            dir.y = 0;
            
            if (dir.lengthSq() < 0.0001) {
                dir.set(0, 0, -1);
            } else {
                dir.normalize();
            }
            
            const pos = camera.position.clone().add(dir.multiplyScalar(8));
            pos.y = -0.05;
            
            createSingleBottle(message, pos);
            spawnRipple(pos); 

            const maxBottles = 40; 
            let currentBottleCount = 0;
            for (let i = 0; i < floaters.length; i++) {
                if (floaters[i].userData.isBottle) currentBottleCount++;
            }
            
            if (currentBottleCount > maxBottles) {
                for (let i = 0; i < floaters.length; i++) {
                    if (floaters[i].userData.isBottle && !floaters[i].userData.isSinking) {
                        const oldBottle = floaters[i];
                        scene.remove(oldBottle);
                        oldBottle.traverse((child) => {
                            if (child.isMesh) {
                                if (child.geometry) child.geometry.dispose();
                                if (child.material) child.material.dispose();
                            }
                        });
                        floaters.splice(i, 1);
                        break;
                    }
                }
            }
        }

            }

            function createBentSegment(woodMaterial, radiusBase, radiusMid, radiusTip, len1, len2, bendAngleY, bendAngleZ) {
                const group = new THREE.Group();

                const geo1 = new THREE.CylinderGeometry(radiusMid, radiusBase, len1, 8);
                const mesh1 = new THREE.Mesh(geo1, woodMaterial);
                mesh1.rotation.z = -Math.PI / 2;
                mesh1.position.x = len1 / 2;
                group.add(mesh1);

                const joint = new THREE.Group();
                joint.position.set(len1, 0, 0);
                joint.rotation.y = bendAngleY;
                joint.rotation.z = bendAngleZ;

                const geo2 = new THREE.CylinderGeometry(radiusTip, radiusMid, len2, 8);
                const mesh2 = new THREE.Mesh(geo2, woodMaterial);
                mesh2.rotation.z = -Math.PI / 2;
                mesh2.position.x = len2 / 2;
                joint.add(mesh2);

                group.add(joint);
                group.position.x = -(len1 + len2 * Math.cos(bendAngleY)) / 2;
                return { group, joint };
            }

            for (let i = 0; i < woodCount; i++) {
                const floaterGroup = new THREE.Group();
                const typeChoice = Math.random();

                const woodMaterial = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0.08, 0.35 + Math.random() * 0.2, 0.20 + Math.random() * 0.15),
                    roughness: 0.9,
                    metalness: 0.05,
                    flatShading: true

                    const angleY = (0.4 + Math.random() * 0.45) * (Math.random() < 0.5 ? 1 : -1);

                    varying vec3 vNormal;

                        vViewPosition = -mvPosition.xyz;
                        vNormal = normalize(normalMatrix * normal);

            });
            moonMesh = new THREE.Mesh(moonGeo, moonMat);

        function createStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 15000; 
            const posArray = new Float32Array(starsCount * 3);
            const colorArray = new Float32Array(starsCount * 3);
            const sizeArray = new Float32Array(starsCount);
            const phaseArray = new Float32Array(starsCount);

            for(let i = 0; i < starsCount; i++) {
                let x, y, z;
                do {
                    x = (Math.random() - 0.5) * 2;
                    y = (Math.random() - 0.5) * 2;
                    z = (Math.random() - 0.5) * 2;
                } while (y < 0.05 || (x*x + y*y + z*z) > 1);
                
                const baseDist = 1500 + Math.random() * 1500;
                const normalize = baseDist / Math.sqrt(x*x + y*y + z*z);
                
                posArray[i*3] = x * normalize;
                posArray[i*3+1] = y * normalize;
                posArray[i*3+2] = z * normalize;
                
                const starType = Math.random();
                let color = new THREE.Color();
                if(starType > 0.90) color.setHex(0xb0d5ff); 
                else if(starType > 0.75) color.setHex(0xffe2be); 
                else if(starType > 0.50) color.setHex(0xffffff); 
                else color.setHex(0x88bbff); 
                
                const brightness = 0.15 + Math.random() * 0.35;
                colorArray[i*3] = color.r * brightness;
                colorArray[i*3+1] = color.g * brightness;
                colorArray[i*3+2] = color.b * brightness;
                
                sizeArray[i] = 1.5 + Math.random() * 3.5;
                phaseArray[i] = Math.random() * Math.PI * 2;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            starsGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
            starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizeArray, 1));
            starsGeometry.setAttribute('phase', new THREE.BufferAttribute(phaseArray, 1));

            const starsMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    globalOpacity: { value: 0 },
                    pixelRatio: { value: renderer.getPixelRatio() }
                },
                vertexShader: `
                    attribute float size;
                    attribute float phase;
                    varying vec3 vColor;
                    varying float vPhase;
                    uniform float pixelRatio;
                    
                    void main() {
                        vColor = color;
                        vPhase = phase;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size * pixelRatio * (800.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    uniform float globalOpacity;
                    varying vec3 vColor;
                    varying float vPhase;
                    
                    void main() {
                        float twinkle = (sin(time * 2.5 + vPhase) + 1.0) * 0.5;
                        float alpha = (0.3 + 0.7 * twinkle) * globalOpacity;
                        
                        vec2 coord = gl_PointCoord - vec2(0.5);
                        if(length(coord) > 0.5) discard;
                        
                        float dist = length(coord);
                        float core = smoothstep(0.5, 0.0, dist);
                        vec3 finalColor = mix(vColor, vec3(1.0), core * 0.8);
                        
                        gl_FragColor = vec4(finalColor, alpha * core * 0.6);
                    }
                `,
                transparent: true,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                fog: false
            });

            stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
        }

        function createBioluminescence() {
            const count = 1000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const phases = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 400; 
                positions[i * 3 + 1] = 0; 
                positions[i * 3 + 2] = (Math.random() - 0.5) * 300 - 50; 
                phases[i] = Math.random() * Math.PI * 2;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(180, 230, 255, 1)');
            grad.addColorStop(0.4, 'rgba(100, 200, 255, 0.9)');
            grad.addColorStop(1, 'rgba(0, 80, 150, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 16, 16);
            const tex = new THREE.CanvasTexture(canvas);

            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    globalOpacity: { value: 0 },
                    map: { value: tex }
                },
                vertexShader: `
                    attribute float phase;
                    varying float vPhase;
                    uniform float time;
                    void main() {
                        vPhase = phase;
                        vec3 pos = position;
                        float driftX = sin(time * 0.3 + phase * 2.0) * 3.0;
                        float driftZ = cos(time * 0.25 + phase * 1.5) * 3.0;
                        pos.x += driftX;
                        pos.z += driftZ;
                        pos.y = sin(pos.x * 0.15 + time * 1.5 + phase) * 0.15 + cos(pos.z * 0.15 + time * 1.2) * 0.15 - 0.05;
                        
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = 20.0 * (10.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D map;
                    uniform float time;
                    uniform float globalOpacity;
                    varying float vPhase;
                    void main() {
                        float alpha = (sin(time * 2.5 + vPhase) * 0.4 + 0.6) * globalOpacity * 1.5;
                        vec4 texColor = texture2D(map, gl_PointCoord);
                        gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
                    }
                `,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            });

            bioluminescence = new THREE.Points(geo, mat);
            scene.add(bioluminescence);
        }

        function triggerWhale(now) {
            isWhaleActive = true;
            whaleStartTime = now;
            lastWhaleTime = now;
            
            const angle = (Math.random() - 0.5) * Math.PI * 0.8 + Math.PI; 
            const dist = 700 + Math.random() * 500; 
            
            whaleGroup.position.set(Math.sin(angle) * dist, -15, Math.cos(angle) * dist);
            whaleGroup.rotation.y = angle + Math.PI / 2;
            whaleGroup.userData.hasSung = false;
            whaleGroup.visible = true;
        }

        function updateWhale(now) {
            if (!whaleGroup) return;
            
            if (!isWhaleActive) {
                if (now - lastWhaleTime > nextWhaleInterval) {
                    triggerWhale(now);
                    nextWhaleInterval = 45000 + Math.random() * 30000; 
                }
                return;
            }
            
            const elapsed = (now - whaleStartTime) * 0.001;
            const t = elapsed / WHALE_DURATION;
            
            if (t >= 1.0) {
                isWhaleActive = false;
                whaleGroup.visible = false;
                return;
            }
            
            const height = Math.sin(t * Math.PI) * 16 - 15;
            whaleGroup.position.y = height;
            whaleGroup.translateZ(-0.6); 
            whaleGroup.rotation.x = Math.cos(t * Math.PI) * 0.2; 
            
            if (elapsed >= 4.0 && elapsed < 4.1 && !whaleGroup.userData.hasSung) {
                playWhaleSound();
                spawnWhaleSpout(whaleGroup.position);
                whaleGroup.userData.hasSung = true;
            }
        }

        function spawnRipple(originPos) {
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    progress: { value: 0.0 },
                    color: { value: new THREE.Color(0xffffff) } 
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float progress;
                    uniform vec3 color;
                    varying vec2 vUv;
                    void main() {
                        vec2 uv = vUv - 0.5;
                        float dist = length(uv) * 2.0; 
                        
                        float ring = 1.0 - smoothstep(0.0, 0.08, abs(dist - progress));
                        float alpha = ring * pow(1.0 - progress, 1.5) * smoothstep(1.0, 0.8, dist);
                        
                        gl_FragColor = vec4(color, alpha * 0.5);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });

            const geo = new THREE.PlaneGeometry(18, 18); 
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2; 
            mesh.position.copy(originPos);
            mesh.position.y = 0.02; 
            scene.add(mesh);

            ripples.push({
                mesh: mesh,
                life: 0.0,
                speed: 0.003 + Math.random() * 0.002 
            });
        }

        function spawnLanternParticles(originPos) {

            for (let i = 0; i < count; i++) {
                const mat = new THREE.ShaderMaterial({
                    uniforms: { opacity: { value: 1.0 } },
                    vertexShader: `
                        varying vec3 vNormal;
                        varying vec3 vViewPosition;
                        void main() {
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            vViewPosition = -mvPosition.xyz;
                            vNormal = normalize(normalMatrix * normal);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        uniform float opacity;
                        varying vec3 vNormal;
                        varying vec3 vViewPosition;
                        void main() {
                            vec3 normal = normalize(vNormal);
                            vec3 viewDir = normalize(vViewPosition);
                            float intensity = max(dot(normal, viewDir), 0.0);
                            intensity = pow(intensity, 2.5);
                            vec3 color = vec3(1.0, 0.45, 0.05);
                            gl_FragColor = vec4(color, intensity * opacity);

                    `,
                    blending: THREE.NormalBlending,
                    transparent: true,
                    depthWrite: false,
                    side: THREE.FrontSide
                });
                
                const mesh = new THREE.Mesh(particleGeo, mat);
