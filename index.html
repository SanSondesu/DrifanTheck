<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrifanTheck</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One&family=Montserrat:wght@300&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Water.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
    
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="start-screen">
        <div class="logo-wrapper" aria-label="Drifting and Drifan Theck — The rock">
            <img src="./%E9%9D%92%E3%80%81%E6%B3%A2%E3%80%81%E7%92%B0%E5%A2%83%E3%80%81%E3%83%AD%E3%82%B3%E3%82%99.png" alt="Drifting and Drifan Theck — The rock" />
        </div>
        <button id="start-btn">はじめる</button>
    </div>

    <button id="write-btn" class="btn">メッセージを流す</button>
    <button id="notebook-btn" class="btn">記憶のノート</button>

    <div id="ui-container">
        <button id="ui-toggle-btn" title="UIの折りたたみ">▼</button>
        <div class="ui-main-row">
            <div id="bottle-counter" class="vertical-text" style="font-size: 1.2rem; font-weight: bold; transition: text-shadow 0.5s;">
                <svg class="bottle-icon" viewBox="0 0 32 52" role="img" aria-label="ボトルのイラスト" xmlns="http://www.w3.org/2000/svg"><path d="M12 3.5h8v5l-1.2 2.2v6.1c0 1.8 1 3.1 3 4.7 2.2 1.8 3.2 3.6 3.2 6.6v16.2c0 2.2-1.8 4-4 4H11c-2.2 0-4-1.8-4-4V28.1c0-3 1-4.8 3.2-6.6 2-1.6 3-2.9 3-4.7v-6.1L12 8.5z" fill="rgba(153,190,190,.22)" stroke="#d9c69b" stroke-width="1.35" stroke-linejoin="round"/><path d="M12 3.5h8v4.8h-8z" fill="#c6a875" stroke="#ead9b7" stroke-width="1"/><path d="M10 28.5c4 1.2 8 1.2 12 0M10 39.5c4 1.2 8 1.2 12 0" fill="none" stroke="rgba(226,218,194,.58)" stroke-width=".9"/><path d="M12.2 23.5c2.1-1.3 5.5-1.3 7.6 0" fill="none" stroke="#e5d7b8" stroke-width="1" stroke-linecap="round"/><path d="M11 30.5v6" stroke="rgba(235,245,239,.55)" stroke-width="1.2" stroke-linecap="round"/></svg><span class="bottle-count-num">0</span>
            </div>
            
            <div style="position: relative; margin: 15px 0;">
                <div class="time-label top">昼</div>
                <div class="time-label bottom">深夜</div>
                <div class="time-label left">朝</div>
                <div class="time-label right">夕</div>
                <div id="circular-slider">
                    <div id="clock-face" aria-hidden="true">
                        <div id="hour-hand" class="clock-hand"></div>
                        <div id="minute-hand" class="clock-hand"></div>
                        <div id="clock-pin"></div>
                    </div>
                    <div id="slider-thumb"></div>
                    <div id="time-display"><span id="hour-text" class="time-part">17</span>:<span id="minute-text" class="time-part">30</span></div>
                </div>
            </div>

            <div class="vertical-text">
                <h1>時間のうつろい</h1>
            </div>
        </div>
        <div id="instruction">ドラッグで視点移動 / スクロールでズーム / ボトルをクリックで読む</div>
    </div>

    <div id="message-container" class="paper-modal">
        <div id="message-text"></div>
        <button id="close-msg-btn" class="btn">海に戻す</button>
    </div>

    <div id="notebook-container" class="paper-modal">
        <div class="notebook-header">
            <h2>海辺の記憶</h2>
            <button id="close-notebook-btn" class="btn">閉じる</button>
        </div>
        <div class="notebook-body">
            <div class="notebook-sidebar">
                <h3>拾った言葉たち</h3>
                <ul id="notebook-messages">
                    <li>まだメッセージを拾っていません。</li>
                </ul>
                
                <h3>出会った漂流物</h3>
                <ul id="notebook-items">
                    <li class="item-li" style="cursor:default;">特別な漂流物にはまだ触れていません。</li>
                </ul>
                <div id="item-description">漂流物の名前を選ぶと、出会いの記録がここに綴られます。</div>
                <section id="sea-observation" aria-label="海の観察記録"><h3>海の観察記録</h3><div id="sea-observation-list"><p>海で過ごした時間が、ここに記録されます。</p></div></section>
            </div>
            <div id="preview-area">
                <canvas id="preview-canvas"></canvas>
                <div id="preview-text">スワイプで回転・ズーム</div>
            </div>
        </div>
    </div>

    <div id="compose-container">
        <h2>メッセージを書く</h2>
        <textarea id="compose-textarea" placeholder="誰かに届くかもしれない言葉..."></textarea>
        <div class="btn-group">
            <button id="send-btn" class="btn">海に流す</button>
            <button id="cancel-btn" class="btn">キャンセル</button>
        </div>
    </div>

    <div id="dial-picker" style="display: none;">
        <div class="dial-wheel-container">
            <ul id="dial-wheel"></ul>
            <div class="dial-selector"></div>
        </div>
        <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5);">タップして決定</div>
    </div>

    <script src="./core-config.js"></script>
    <script src="./runtime-guard.js"></script>
    <script src="./resource-manager.js"></script>
    <script src="./object-manager.js"></script>
    <script src="./persistence.js"></script>
    <script src="./app.js"></script>
    <script src="./audio.js"></script>
    <script src="./notebook-preview.js"></script>
    <script src="./ui-controls.js"></script>
    <script src="./interaction.js"></script>
    <script src="./world-objects.js"></script>
    <script src="./environment.js"></script>
    <script src="./enhancements.js"></script>
    <script src="./diagnostics.js"></script>
</body>
</html>
